<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나물바라기 - 나물 처방전</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.2/kakao.min.js" crossorigin="anonymous"></script>
<style>
:root{
  --green:#1f3315;--green-mid:#2c4a1f;--green-soft:#5a7a4a;
  --pale:#eaf3de;--border:#d8e3d0;--paper:#ffffff;--bg:#eef2ea;
  --theme-bg:#eef2ea;--theme-accent:#2c4a1f;--theme-soft:#5a7a4a;
  --theme-pale:#eaf3de;--theme-border:#d8e3d0;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif;color:#222;font-size:17px;line-height:1.65;}
.container{max-width:480px;margin:0 auto;padding:32px 20px 40px;min-height:100vh;}
.card{background:var(--paper);border-radius:16px;padding:26px 22px;border:1px solid var(--border);}
button{font-family:inherit;cursor:pointer;border:none;background:none;}

/* 표지 */
.cover-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:78vh;text-align:center;gap:14px;}
.logo-small{color:var(--green-soft);font-size:15px;letter-spacing:2px;font-weight:500;}
.cover-title{color:var(--green);font-size:32px;font-weight:700;line-height:1.4;margin:0;}
.cover-sub{color:var(--green-soft);font-size:16px;margin-top:4px;}
.btn-start{margin-top:22px;background:var(--green-mid);color:#fff;font-weight:700;font-size:17px;padding:16px 40px;border-radius:999px;}
.btn-start:active{transform:scale(.98);}
.btn-history{margin-top:10px;background:#fff;color:var(--green-mid);font-size:15px;padding:12px 30px;border-radius:999px;border:1px solid var(--border);}
.admin-link{margin-top:32px;font-size:12px;color:var(--green-soft);opacity:.5;text-decoration:underline;}

/* 문진 */
.quiz-intro{font-size:14px;color:var(--green-soft);margin:0 0 16px;}
.quiz-list{display:flex;flex-direction:column;gap:14px;padding-bottom:110px;}
.q-block{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;transition:border-color .2s;}
.q-block.answered{border-color:var(--green-mid);}
.q-num{font-size:12px;color:var(--green-soft);margin:0 0 6px;font-weight:700;}
.q-text{font-size:17px;font-weight:700;color:var(--green);margin:0 0 12px;}
.q-options{display:flex;gap:10px;}
.opt-btn{flex:1;text-align:center;padding:12px 8px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:15px;color:#333;}
.opt-btn.active{background:var(--green-mid);color:#fff;border-color:var(--green-mid);font-weight:700;}
.submit-bar{position:fixed;left:0;right:0;bottom:0;background:var(--paper);border-top:1px solid var(--border);padding:14px 20px;}
.submit-bar-inner{max-width:440px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;}
.submit-count{font-size:13px;color:var(--green-soft);}
.submit-btn{background:var(--green-mid);color:#fff;font-weight:700;padding:13px 26px;border-radius:999px;font-size:15px;}
.submit-btn:disabled{background:#cfd8c8;color:#fff;cursor:not-allowed;}

/* 로딩 */
.loading-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:70vh;gap:18px;}
.spinner{width:46px;height:46px;border-radius:50%;border:4px solid var(--pale);border-top-color:var(--green-mid);animation:spin .9s linear infinite;}
@media(prefers-reduced-motion:reduce){.spinner{animation:none;}}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-text{color:var(--green);font-size:17px;font-weight:500;}

/* 처방전 */
.rx-wrap{background:var(--theme-bg);border-radius:16px;padding:4px;transition:background .4s;}
.rx-card{border:1.5px solid var(--theme-accent);border-radius:14px;background:#fff;padding:26px 22px;}
.rx-header{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1.5px solid var(--theme-accent);padding-bottom:16px;margin-bottom:16px;}
.rx-title{font-size:24px;font-weight:700;color:var(--theme-accent);margin:6px 0 0;}
.rx-date{font-size:12px;color:var(--theme-soft);margin:5px 0 0;}
.stamp{width:54px;height:54px;border-radius:50%;border:2px dashed var(--theme-accent);display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);flex-shrink:0;}
.stamp span{font-size:10px;color:var(--theme-accent);font-weight:700;text-align:center;line-height:1.25;}
.rx-theme-badge{display:inline-block;font-size:12px;font-weight:700;color:var(--theme-accent);background:var(--theme-pale);padding:3px 10px;border-radius:999px;margin-bottom:10px;}
.rx-summary-label{font-size:12px;color:var(--theme-soft);margin:0 0 4px;}
.rx-summary-text{font-size:15px;color:var(--theme-accent);margin:0 0 18px;font-weight:500;}

/* 나물 아이템 */
.item{display:flex;gap:12px;align-items:flex-start;border-top:1px solid var(--theme-pale);padding-top:16px;margin-top:16px;}
.item:first-child{border-top:none;padding-top:0;margin-top:0;}
.leaf-ico{flex-shrink:0;margin-top:2px;}
.item-body{flex:1;min-width:0;}
.item-name-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px;}
.item-name{font-size:18px;font-weight:700;color:var(--theme-accent);cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;}
.item-name:hover{opacity:.8;}
.tag-pill{font-size:11px;color:var(--theme-accent);background:var(--theme-pale);padding:2px 8px;border-radius:999px;}
.season-pill{font-size:11px;color:#e67e22;background:#fef5e7;padding:2px 8px;border-radius:999px;font-weight:700;}
.item-desc{font-size:14px;color:var(--theme-soft);margin:0 0 3px;}
.item-recipe{font-size:13px;color:#777;margin:0 0 4px;font-style:italic;}
.bundle-note{font-size:11px;color:#9aab8f;margin:0 0 5px;}
.alt-line{font-size:12px;color:var(--theme-soft);margin-top:6px;}
.buy-btn{flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;padding:9px 14px;border-radius:8px;border:1.5px solid var(--theme-accent);color:var(--theme-accent);font-size:13px;font-weight:500;text-decoration:none;white-space:nowrap;align-self:center;}

/* 궁합 */
.pairing-section{margin-top:20px;padding:16px;background:var(--theme-pale);border-radius:12px;}
.pairing-title{font-size:13px;font-weight:700;color:var(--theme-accent);margin:0 0 12px;}
.pair-item{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;}
.pair-item:last-child{margin-bottom:0;}
.pair-names{font-size:14px;font-weight:700;color:var(--theme-accent);white-space:nowrap;flex-shrink:0;}
.pair-desc{font-size:13px;color:var(--theme-soft);line-height:1.5;}

/* 버튼 */
.disclaimer{font-size:12px;color:#888;margin-top:22px;padding-top:16px;border-top:1px solid var(--theme-pale);line-height:1.6;}
.rx-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px;}
.rx-actions-row{display:flex;gap:10px;}
.action-btn{padding:13px;border-radius:10px;font-size:14px;text-align:center;width:100%;}
.action-primary{background:var(--theme-accent);color:#fff;font-weight:700;border:1.5px solid var(--theme-accent);}
.action-secondary{background:#fff;color:#333;border:1px solid var(--border);}
.action-kakao{background:#FEE500;color:#3C1E1E;font-weight:700;border:1px solid #e6cf00;}
.action-insta{background:#fff;color:var(--theme-accent);border:1.5px solid var(--theme-accent);font-weight:700;}
.capturing .rx-actions{display:none;}

/* 히스토리 */
.history-title{font-size:20px;font-weight:700;color:var(--green);margin:0 0 4px;}
.history-sub{font-size:13px;color:var(--green-soft);margin:0 0 18px;}
.hist-item{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:12px;background:#fff;}
.hist-date{font-size:12px;color:var(--green-soft);margin:0 0 4px;}
.hist-cats{font-size:13px;color:var(--green);font-weight:500;margin:0 0 4px;}
.hist-namul{font-size:14px;color:#444;margin:0 0 6px;}
.hist-diff{font-size:12px;margin:0;}
.diff-new{color:#2c7a2c;font-weight:500;}
.diff-gone{color:#888;}
.hist-empty{font-size:14px;color:var(--green-soft);text-align:center;padding:30px 0;}

/* 관리자 */
.admin-pass-input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;font-size:16px;margin-bottom:12px;}
.admin-error{color:#b33939;font-size:13px;margin-bottom:10px;}
.admin-cancel{display:block;margin-top:8px;font-size:13px;color:var(--green-soft);text-decoration:underline;}
.admin-title{font-size:20px;font-weight:700;color:var(--green);margin:0 0 4px;}
.admin-sub{font-size:13px;color:var(--green-soft);margin:0 0 18px;}
.stat-block{margin-bottom:22px;}
.stat-block h3{font-size:15px;color:var(--green);margin:0 0 8px;font-weight:700;}
.stat-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--pale);font-size:15px;}
.stat-rank{color:var(--green-soft);font-size:13px;margin-right:8px;}
.stat-empty{font-size:14px;color:var(--green-soft);}
.admin-actions{display:flex;gap:10px;margin-top:10px;}

/* 나물 상세 모달 */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:flex;align-items:flex-end;justify-content:center;}
.modal-sheet{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:480px;padding:28px 24px 40px;max-height:85vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:#ddd;border-radius:999px;margin:0 auto 20px;}
.modal-name{font-size:24px;font-weight:700;color:var(--theme-accent);margin:0 0 6px;}
.modal-tag{font-size:13px;color:var(--theme-accent);background:var(--theme-pale);display:inline-block;padding:3px 10px;border-radius:999px;margin-bottom:16px;}
.modal-section{margin-bottom:16px;}
.modal-section-title{font-size:12px;font-weight:700;color:var(--green-soft);margin:0 0 5px;letter-spacing:.5px;}
.modal-section-body{font-size:15px;color:#333;margin:0;line-height:1.6;}
.modal-cook{display:flex;flex-wrap:wrap;gap:8px;margin:0;}
.modal-cook-item{background:var(--pale);color:var(--green);font-size:13px;padding:5px 12px;border-radius:999px;}
.modal-caution{font-size:13px;color:#b85c3a;background:#fff8f5;padding:10px 14px;border-radius:10px;margin:0;}
.modal-close{width:100%;padding:14px;border-radius:12px;background:var(--green-mid);color:#fff;font-size:15px;font-weight:700;margin-top:22px;}

/* 인스타 카드 (숨겨진 캡처용) */
#instaCard{
  position:fixed;left:-9999px;top:0;
  width:600px;height:600px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:50px;text-align:center;
  background:var(--theme-bg);
  font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
.insta-logo{margin-bottom:16px;}
.insta-sub{font-size:18px;color:var(--theme-soft);margin:0 0 20px;letter-spacing:2px;}
.insta-namul{font-size:38px;font-weight:700;color:var(--theme-accent);line-height:1.4;margin:0 0 20px;word-break:keep-all;}
.insta-divider{width:60px;height:3px;background:var(--theme-accent);border-radius:999px;margin:0 auto 20px;}
.insta-symptom{font-size:16px;color:var(--theme-soft);margin:0 0 30px;}
.insta-url{font-size:14px;color:var(--theme-accent);opacity:.7;margin:0;}


/* 식습관 분석 */
.diet-trigger{width:100%;margin-top:14px;padding:14px;border-radius:10px;border:1.5px dashed var(--theme-accent);background:transparent;color:var(--theme-accent);font-size:14px;font-weight:600;cursor:pointer;}
.diet-box{margin-top:20px;padding:18px;border-radius:14px;border:1.5px solid var(--theme-accent);background:var(--theme-pale);}
.diet-box-title{font-size:14px;font-weight:700;color:var(--theme-accent);margin:0 0 14px;display:flex;align-items:center;gap:6px;}
.diet-comment{display:flex;gap:8px;align-items:flex-start;margin-bottom:10px;font-size:14px;color:var(--theme-soft);line-height:1.55;}
.diet-comment:last-child{margin-bottom:0;}
.diet-dot{flex-shrink:0;width:6px;height:6px;border-radius:50%;background:var(--theme-accent);margin-top:8px;}
.diet-redo{font-size:12px;color:var(--theme-soft);text-decoration:underline;margin-top:12px;display:block;}

/* 식습관 문진 */
.diet-quiz-wrap{padding-bottom:110px;}
.diet-q-block{background:var(--paper);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:14px;}
.diet-opts{display:flex;flex-direction:column;gap:8px;margin-top:12px;}
.diet-opt{text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--border);background:#fff;font-size:15px;color:#333;}
.diet-opt.active{background:var(--green-mid);color:#fff;border-color:var(--green-mid);font-weight:700;}
.diet-back{font-size:13px;color:var(--green-soft);text-decoration:underline;display:inline-block;margin-bottom:16px;}
@media print{.rx-actions{display:none;}}
</style>
</head>

function findPairs(names){
  var found=[];
  for(var i=0;i<names.length;i++)
    for(var j=i+1;j<names.length;j++){
      var key=[names[i],names[j]].sort().join("|");
      if(PAIRS[key]) found.push({a:names[i],b:names[j],desc:PAIRS[key]});
    }
  return found;
}

/* ===================== 문진 (자동 스크롤) ===================== */
function renderQuiz(){
  var blocks=QUESTIONS.map(function(q,i){
    var cur=state.answers[q.cat];
    var ya=cur===true?" active":"";var na=cur===false?" active":"";
    var answered=(cur!==undefined)?" answered":"";
    return '<div class="q-block'+answered+'" data-cat="'+q.cat+'" id="qb'+i+'">'+
      '<p class="q-num">Q'+(i+1)+'</p>'+
      '<p class="q-text">'+q.text+'</p>'+
      '<div class="q-options">'+
        '<button class="opt-btn'+ya+'" data-val="yes">예, 그런 편이에요</button>'+
        '<button class="opt-btn'+na+'" data-val="no">아니요, 별로 안 그래요</button>'+
      '</div></div>';
  }).join("");
  app.innerHTML=
    '<p class="q-num" style="margin-bottom:6px;">1단계 · 증상 확인</p>'+
    '<p class="quiz-intro">10개 문항 모두에 답하시면 다음 단계로 넘어가요.</p>'+
    '<div class="quiz-list" id="quizList">'+blocks+'</div>'+
    '<div class="submit-bar"><div class="submit-bar-inner">'+
      '<span class="submit-count" id="submitCount">0 / 10개 답변</span>'+
      '<button class="submit-btn" id="submitBtn" disabled>처방전 받기</button>'+
    '</div></div>';

  var qList=document.getElementById("quizList");
  var submitBtn=document.getElementById("submitBtn");
  var submitCount=document.getElementById("submitCount");

  function updateBar(){
    var n=Object.keys(state.answers).length;
    submitCount.textContent=n+" / 10개 답변";
    submitBtn.disabled=n<QUESTIONS.length;
  }

  qList.addEventListener("click",function(e){
    var btn=e.target.closest(".opt-btn");if(!btn) return;
    var block=btn.closest(".q-block");
    var cat=block.getAttribute("data-cat");
    var isNew=state.answers[cat]===undefined;
    state.answers[cat]=(btn.getAttribute("data-val")==="yes");
    block.querySelectorAll(".opt-btn").forEach(function(o){o.classList.toggle("active",o===btn);});
    block.classList.add("answered");
    updateBar();
    /* 자동 스크롤: 처음 답변할 때만 다음 질문으로 이동 */
    if(isNew){
      var allBlocks=Array.from(qList.querySelectorAll(".q-block"));
      var idx=allBlocks.indexOf(block);
      if(idx<allBlocks.length-1){
        setTimeout(function(){
          allBlocks[idx+1].scrollIntoView({behavior:"smooth",block:"center"});
        },150);
      }
    }
  });

  submitBtn.onclick=function(){
    if(Object.keys(state.answers).length<QUESTIONS.length) return;
    state.step="dietQuiz"; render();
  };
  updateBar();
}

/* ===================== 히스토리 + 비교 ===================== */
function renderHistory(){
  var recs=getRecords().slice().reverse();
  var latest=recs[0];var prev=recs[1];

  var histHTML="";
  if(recs.length===0){
    histHTML='<p class="hist-empty">아직 저장된 처방 기록이 없어요.</p>';
  } else {
    histHTML=recs.slice(0,5).map(function(r,idx){
      var d=new Date(r.date);
      var dStr=d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0");
      var cats=r.fallback?"증상 없음":((r.cats||[]).map(function(c){return CATEGORY_META[c]&&CATEGORY_META[c].symptom;}).filter(Boolean).join(" · ")||"—");
      var namul=(r.recommended||[]).join(", ")||"—";
      var diffHTML="";
      /* 첫 번째(최신) 기록 + 이전 기록이 있을 때만 비교 */
      if(idx===0&&prev){
        var prevSet=prev.recommended||[];
        var curSet=r.recommended||[];
        var added=curSet.filter(function(n){return prevSet.indexOf(n)===-1;});
        var gone=prevSet.filter(function(n){return curSet.indexOf(n)===-1;});
        if(added.length||gone.length){
          diffHTML='<p class="hist-diff">';
          if(added.length) diffHTML+='<span class="diff-new">+ 새로 추천: '+added.join(", ")+'</span> ';
          if(gone.length)  diffHTML+='<span class="diff-gone">- 빠진 나물: '+gone.join(", ")+'</span>';
          diffHTML+='</p>';
        }
      }
      return '<div class="hist-item">'+
        '<p class="hist-date">'+dStr+(idx===0?' · 최근':'')+' </p>'+
        '<p class="hist-cats">증상: '+cats+'</p>'+
        '<p class="hist-namul">추천: '+namul+'</p>'+
        diffHTML+
      '</div>';
    }).join("");
  }

  app.innerHTML=
    '<div class="card">'+
      '<p class="history-title">내 처방 기록</p>'+
      '<p class="history-sub">최근 5회 기록 · 이전 처방과 비교해드려요</p>'+
      histHTML+
      '<button class="action-btn action-primary" id="closeHistBtn" style="margin-top:16px;">닫기</button>'+
    '</div>';
  document.getElementById("closeHistBtn").onclick=function(){state.step="cover";render();};
}

function topList(obj,limit){
  return Object.keys(obj).map(function(k){return{key:k,count:obj[k]};})
    .sort(function(a,b){return b.count-a.count;}).slice(0,limit);
}
function computeStats(){
  var recs=getRecords();var catCount={};var nameCount={};
  recs.forEach(function(r){
    (r.cats||[]).forEach(function(c){catCount[c]=(catCount[c]||0)+1;});
    (r.recommended||[]).forEach(function(n){nameCount[n]=(nameCount[n]||0)+1;});
  });
  return{total:recs.length,topCats:topList(catCount,5),topNames:topList(nameCount,5)};
}
function renderAdmin(){

/* ===================== 식습관 분석 박스 ===================== */
function buildDietBox(){
  var comments=[];
  Object.keys(DIET_COMMENTS).forEach(function(key){
    var val=state.dietAnswers[key];
    if(val && DIET_COMMENTS[key][val]) comments.push(DIET_COMMENTS[key][val]);
  });
  var rows=comments.map(function(c){
    return '<div class="diet-comment"><span class="diet-dot"></span><span>'+c+'</span></div>';
  }).join("");
  return '<div class="diet-box">'+
    '<p class="diet-box-title">🥗 식습관 & 선호도 분석</p>'+
    rows+
    '<button class="diet-redo" id="dietRedoBtn">식습관 다시 답변하기</button>'+
  '</div>';
}

function renderDietQuiz(){
  var blocks=DIET_QUESTIONS.map(function(q,i){
    var cur=state.dietAnswers[q.key];
    var optsHTML=q.opts.map(function(o){
      var active=(cur===o)?" active":"";
      return '<button class="diet-opt'+active+'" data-key="'+q.key+'" data-val="'+o+'">'+o+'</button>';
    }).join("");
    var answered=(cur!==undefined)?" answered":"";
    return '<div class="diet-q-block'+answered+'" id="dqb'+i+'">'+
      '<p class="q-num">Q'+(i+1)+'</p>'+
      '<p class="q-text">'+q.text+'</p>'+
      '<div class="diet-opts">'+optsHTML+'</div>'+
    '</div>';
  }).join("");

  app.innerHTML=
    '<p class="q-num" style="margin-bottom:6px;">2단계 · 식습관 & 선호도</p>'+
    '<button class="diet-back" id="dietBackBtn">← 증상 문진으로 돌아가기</button>'+
    '<div class="diet-quiz-wrap" id="dietList">'+blocks+'</div>'+
    '<div class="submit-bar"><div class="submit-bar-inner">'+
      '<span class="submit-count" id="dietCount">0 / 5개 답변</span>'+
      '<button class="submit-btn" id="dietSubmitBtn" disabled>분석 완료</button>'+
    '</div></div>';

  var dietList=document.getElementById("dietList");
  var dietSubmitBtn=document.getElementById("dietSubmitBtn");
  var dietCount=document.getElementById("dietCount");

  function updateDietBar(){
    var n=Object.keys(state.dietAnswers).length;
    dietCount.textContent=n+" / 5개 답변";
    dietSubmitBtn.disabled=n<DIET_QUESTIONS.length;
  }

  dietList.addEventListener("click",function(e){
    var btn=e.target.closest(".diet-opt"); if(!btn) return;
    var key=btn.getAttribute("data-key");
    var val=btn.getAttribute("data-val");
    var isNew=state.dietAnswers[key]===undefined;
    state.dietAnswers[key]=val;
    var block=btn.closest(".diet-q-block");
    block.querySelectorAll(".diet-opt").forEach(function(o){o.classList.toggle("active",o===btn);});
    block.classList.add("answered");
    updateDietBar();
    if(isNew){
      var allBlocks=Array.from(dietList.querySelectorAll(".diet-q-block"));
      var idx=allBlocks.indexOf(block);
      if(idx<allBlocks.length-1){
        setTimeout(function(){
          allBlocks[idx+1].scrollIntoView({behavior:"smooth",block:"center"});
        },150);
      }
    }
  });

  document.getElementById("dietBackBtn").onclick=function(){
    state.step="quiz"; render();
    setTimeout(function(){
      var bar=document.querySelector(".submit-bar");
      if(bar) bar.scrollIntoView({behavior:"smooth",block:"end"});
    },100);
  };

  dietSubmitBtn.onclick=function(){
    if(Object.keys(state.dietAnswers).length<DIET_QUESTIONS.length) return;
    state.dietDone=true;
    state.step="loading"; render();
    setTimeout(function(){state.step="result"; render();},1200);
  };

  updateDietBar();
}

if(KAKAO_APP_KEY&&typeof Kakao!=="undefined"){try{Kakao.init(KAKAO_APP_KEY);}catch(e){}}
render();
</script>
</body>
</html>
